name: Release macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release-macos:
    name: Build DMG and updater bundle
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Verify Rust toolchain and targets
        working-directory: source
        run: |
          rustup show active-toolchain
          rustup target list --installed

      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches app version
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if [ "v${version}" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version v${version}" >&2
            exit 1
          fi

      - name: Build and publish macOS updater bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          APPLE_SIGNING_IDENTITY: "-"
        with:
          projectPath: source
          tagName: ${{ github.ref_name }}
          releaseName: 417Switch ${{ github.ref_name }}
          releaseBody: |
            ## 417Switch ${{ github.ref_name }}

            ### 主要更新

            - 启动前并发检查 Claude Science 的历史目录授权，避免沙箱初始化被慢路径拖住
            - 无法在短时间内解析的目录授权会自动移除，正常目录授权保持不变
            - 端口回收与进程终止继续保持 PID/runtime 双重校验

            ### macOS 下载

            下载 Release 中的 universal `.dmg`，同时支持 Apple Silicon 和 Intel Mac。

            本 Release 也包含 Tauri updater 签名包和 `latest.json`。安装本版本后，
            后续版本可由 417Switch 自动检查，并在应用内下载安装。

            > 当前构建使用 ad-hoc 签名，首次打开时 macOS 可能要求右键选择“打开”。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --target universal-apple-darwin --bundles app

      - name: Create universal macOS DMG
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          app_path="src-tauri/target/universal-apple-darwin/release/bundle/macos/417Switch.app"
          dmg_dir="src-tauri/target/universal-apple-darwin/release/bundle/dmg"
          dmg_path="${dmg_dir}/417Switch_${GITHUB_REF_NAME#v}_universal.dmg"
          staging_dir="${RUNNER_TEMP}/417switch-dmg-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          test -d "$app_path"
          mkdir -p "$dmg_dir" "$staging_dir"
          cp -R "$app_path" "$staging_dir/"
          ln -s /Applications "$staging_dir/Applications"

          for attempt in 1 2 3; do
            if hdiutil create \
              -volname "417Switch" \
              -srcfolder "$staging_dir" \
              -ov \
              -format UDZO \
              "$dmg_path"; then
              exit 0
            fi

            rm -f "$dmg_path"
            echo "DMG creation attempt ${attempt} failed; retrying..." >&2
            sleep $((attempt * 5))
          done

          echo "Failed to create DMG after 3 attempts" >&2
          exit 1

      - name: Upload DMG to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "source/src-tauri/target/universal-apple-darwin/release/bundle/dmg/417Switch_${GITHUB_REF_NAME#v}_universal.dmg" \
            --clobber
